[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-sentry"
version = "0.1.0"
description = "Instruction-level GPU cryptomining detection"
requires-python = ">=3.11"
dependencies = [
  "accelerate",
  "datasets",
  "fsspec<=2026.2.0",
  "huggingface_hub",
  "joblib",
  "numpy",
  "scikit-learn",
  "tokenizers>=0.21,<0.22",
  "torch==2.12.0",
  "tqdm",
  "transformers>=4.48,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
